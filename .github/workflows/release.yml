name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  tests:
    name: Re-run release tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install release test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mlx==0.32.0" -e ".[test]"
      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build tagged artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Verify annotated tag and package version
        id: version
        shell: bash
        run: |
          test "$(git cat-file -t "${GITHUB_REF}")" = "tag"
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
          echo "version=${package_version}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2,<2" "twine>=6,<7"
          python -m build
      - name: Validate metadata and archive contents
        run: |
          python -m twine check dist/*
          python scripts/check_dist.py dist | tee dist/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs:
      - build
      - tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/mlx-kfac
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist
      - name: Keep only package archives in the upload directory
        run: rm dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    name: Verify the TestPyPI wheel
    needs:
      - build
      - publish-testpypi
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Download the published wheel
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mkdir testpypi-dist
          for attempt in {1..12}; do
            if python -m pip download \
              --dest testpypi-dist \
              --index-url https://test.pypi.org/simple/ \
              --no-deps \
              --only-binary=:all: \
              "mlx-kfac==${VERSION}"; then
              break
            fi
            if [ "$attempt" = 12 ]; then
              exit 1
            fi
            sleep 10
          done
      - name: Install and import
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m pip install "mlx==0.32.0"
          python -m pip install --no-deps testpypi-dist/*.whl
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          python -c 'import os; from importlib.metadata import version; import mlx_kfac; assert version("mlx-kfac") == os.environ["VERSION"]; assert {"CompiledKFACStep", "KFAC", "compile_kfac_step", "estimate_kfac_state_bytes"} <= set(mlx_kfac.__all__)'

  publish-pypi:
    name: Publish to PyPI
    needs:
      - build
      - verify-testpypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/mlx-kfac
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist
      - name: Keep only package archives in the upload directory
        run: rm dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    name: Create GitHub release
    needs:
      - publish-pypi
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist
      - name: Attach immutable release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
